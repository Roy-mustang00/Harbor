[package]
name = "tauri-plugin-harbor-exoplayer"
links = "tauri-plugin-harbor-exoplayer"
version = "0.1.0"
edition = "2021"
description = "Android Media3/ExoPlayer bridge for Harbor's phone player (window.HarborExo)."
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
