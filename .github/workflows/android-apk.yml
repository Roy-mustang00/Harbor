name: Android APK (Harbor)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144
  HARBOR_CAPSTAN_OPTIONAL: "1"

jobs:
  build-apk:
    name: Build Android APK (aarch64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project (Tauri)
        run: pnpm tauri android init

      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64 --config src-tauri/tauri.android.conf.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
