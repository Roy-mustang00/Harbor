name: Android APK (Harbor)

# Builds an installable debug APK of Harbor for Android using the project's
# own Tauri Android configuration (src-tauri/tauri.android.conf.json).
# Trigger it manually from the Actions tab: "Android APK (Harbor)" -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # Same flag the project's own CI uses: the extension compat layer is not in
  # this repository, so the build compiles without it.
  HARBOR_CAPSTAN_OPTIONAL: "1"

jobs:
  build-apk:
    name: Build Android APK (aarch64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages and NDK
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.2.12479018"
          # Runner images preinstall newer NDKs and some tools pick the newest
          # installed one instead of NDK_HOME (NDK 30 broke unrar_sys: lutimes).
          # Remove every other NDK so the pinned 27.2 is the only one available.
          for d in "$ANDROID_HOME"/ndk/*/; do
            if [ "$d" != "$ANDROID_HOME/ndk/27.2.12479018/" ]; then sudo rm -rf "$d"; fi
          done
          ls "$ANDROID_HOME/ndk"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project (Tauri)
        run: pnpm tauri android init

      - name: Build APK
        run: pnpm tauri android build --debug --apk --target aarch64 --config src-tauri/tauri.android.conf.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
