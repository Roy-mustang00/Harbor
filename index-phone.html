      rel="stylesheet"

    <style>
      html,
      body,
      #root {
        background: var(--color-canvas, #111214);
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }
      #harbor-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 280ms ease-out;
      }
      #harbor-boot-chrome {
        position: fixed;
        top: 8px;
        right: 10px;
        display: flex;
        gap: 4px;
        z-index: 10000;
        -webkit-app-region: no-drag;
      }
      #harbor-boot-chrome button {
        width: 32px;
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #878d9c;
        font: 12px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      #harbor-boot-chrome button:hover {
        background: #1c1e25;
        color: #e9ecf2;
      }
      #harbor-boot-chrome button[data-act="close"]:hover {
        background: #c0392b;
        color: #fff;
      }
      #harbor-boot.gone {
        opacity: 0;
      }
      /* Boot diagnostics (silent check 15): the panel is created by the
         pre-bundle script below and by main-phone.tsx's boot-error helper.
         It stays hidden until an error is recorded, so a healthy boot keeps
         the plain sail. When shown, the cover must accept taps so the
         Reload button works — the cover itself is pointer-events: none. */
      #harbor-boot-error {
        display: none;
        max-width: min(520px, 88vw);
        max-height: 52vh;
        overflow-y: auto;
        margin-top: 24px;
        padding: 14px 16px;
        border-radius: 12px;
        background: rgba(28, 30, 37, 0.96);
        color: #e9ecf2;
        font: 13px/1.55 system-ui, sans-serif;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        pointer-events: auto;
      }
      #harbor-boot-error:not(:empty) {
        display: block;
      }
      #harbor-boot-error button {
        display: block;
        margin-top: 12px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: #e8aa6c;
        color: #111214;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
      #harbor-boot > svg {
        width: 96px;
        height: auto;
        color: #f5f5f5;
        filter: drop-shadow(0 10px 30px rgba(232, 170, 108, 0.22));
        transform-origin: center 65%;
        animation:
          harborBootBob 2400ms ease-in-out infinite,
          harborBootGlow 2400ms ease-in-out infinite;
      }
      @keyframes harborBootBob {
        0% {
          transform: translateY(0) rotate(-2deg) scale(0.98);
        }
        25% {
          transform: translateY(-3px) rotate(0deg) scale(1);
        }
        50% {
          transform: translateY(0) rotate(2deg) scale(1.02);
        }
        75% {
          transform: translateY(-3px) rotate(0deg) scale(1);
        }
        100% {
          transform: translateY(0) rotate(-2deg) scale(0.98);
        }
      }
      @keyframes harborBootGlow {
        0%,
        100% {
          opacity: 0.78;
        }
        50% {
          opacity: 1;
        }
      }
      #root[data-startup-hidden] {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          var hdrOverlay = p.get("harbor-overlay") === "1";
          if (p.get("harbor-dj") === "1") {
            var bar = document.createElement("div");
            bar.id = "harbor-boot-chrome";
            bar.innerHTML =
              '<button type="button" data-act="min" aria-label="Minimise">&#8211;</button>' +
              '<button type="button" data-act="close" aria-label="Close">&#10005;</button>';
            bar.addEventListener("click", function (event) {
              var act = event.target && event.target.getAttribute("data-act");
              if (!act) return;
              var api = window.__TAURI__ && window.__TAURI__.window;
              var win = api && api.getCurrentWindow && api.getCurrentWindow();
              if (!win) return;
              if (act === "min") win.minimize();
              else win.close();
            });
            document.addEventListener("DOMContentLoaded", function () {
              document.body.appendChild(bar);
            });
          }
          if (p.get("harbor-modal") === "1" || hdrOverlay) {
            var s = document.createElement("style");
            s.textContent = "#harbor-boot{display:none !important}";
            if (hdrOverlay) {
              s.textContent += "html,body,#root{background:transparent !important}";
            }
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="harbor-boot">
      <svg viewBox="0 0 700 642.88" fill="currentColor" aria-hidden="true">
        <g transform="matrix(0.13333333,0,0,-0.13333333,0,642.88)">
          <path
            d="m 72.0781,1534.27 c 0,0 1127.5819,922.03 1526.9319,2636.89 0,0 463.95,-1274.4 17.61,-2625.15 L 72.0781,1534.27"
          />
          <path
            d="M 3975.59,2945.05 2812.18,2222.26 c -36.68,-22.79 -84.13,3.59 -84.13,46.78 v 1391.45 c 0,42.35 45.8,68.85 82.51,47.75 l 1163.41,-668.68 c 36.11,-20.75 37,-72.53 1.62,-94.51 z M 2021.85,4821.57 V 1438.84 l 2818.94,416.96 c 0,0 252.54,2501.82 -2818.94,2965.77"
          />
          <path
            d="m 615.313,4.40234 c 0,0 -364.817,308.39866 -604.4224,706.25766 -28.3125,47.012 1.4922,107.77 55.8555,115.281 L 5090.13,1520.12 c 57.31,7.92 102.66,-47.69 82.95,-102.09 C 5065.81,1122 4746.77,351.742 4222.68,0 L 615.313,4.40234"
          />
        </g>
      </svg>
    </div>
    <div id="root" inert data-startup-hidden></div>
    <script>
      // Paint the saved poster before React or the animation player loads.
      try {
        var art = JSON.parse(localStorage.getItem('harbor.custom-artwork.v1') || '{}').launch;
        if (art && /^[\w-]{1,80}$/.test(art.id) && typeof art.poster === 'string' && art.poster.length < 200000 && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(art.poster)) {
          var mark = document.querySelector('#harbor-boot > svg');
          var custom = document.createElement('div');
          custom.id = 'harbor-custom-boot-art';
          custom.style.cssText = 'position:relative;width:128px;height:128px';
          custom.setAttribute('aria-hidden', 'true');
          var poster = document.createElement('img');
          poster.src = art.poster; poster.alt = ''; poster.style.cssText = 'width:100%;height:100%;object-fit:contain';
          custom.appendChild(poster); mark.after(custom); mark.style.display = 'none';
        }
      } catch (e) {}
    </script>
    <script>
      // Pre-bundle boot diagnostics (silent check 15). This classic script
      // runs before the deferred module scripts below, so it also covers
      // the one case main-phone.tsx cannot: a module import/parse failure,
      // where its own module-scope 15 s timer never registers and the sail
      // would otherwise hang forever with no evidence. On a phone there is
      // no adb/chrome://inspect, so the error must be on the screen.
      // Inline scripts are already the pattern in this file (overlay +
      // artwork scripts above), so no new CSP/Tauri-inline risk is added.
      (function () {
        var KEY = "harbor.phone-boot-error.v1";
        var shown = "";
        function panel() {
          var boot = document.getElementById("harbor-boot");
          if (!boot) return null;
          var p = document.getElementById("harbor-boot-error");
          if (!p) {
            p = document.createElement("div");
            p.id = "harbor-boot-error";
            boot.appendChild(p);
          }
          boot.style.pointerEvents = "auto";
          return p;
        }
        function show(text) {
          if (!text || text === shown) return;
          shown = text;
          var p = panel();
          if (!p) return;
          p.textContent = "";
          var msg = document.createElement("div");
          msg.textContent = text;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "Reload app";
          btn.addEventListener("click", function () {
            window.location.reload();
          });
          p.appendChild(msg);
          p.appendChild(btn);
        }
        function record(text) {
          try {
            window.localStorage.setItem(KEY, String(text).slice(0, 2000));
          } catch (e) {}
        }
        function describe(err) {
          if (err == null) return "Unknown error";
          if (typeof err === "string") return err;
          var m = err.message || String(err);
          if (err.stack) m += "\n" + String(err.stack).slice(0, 800);
          return m;
        }
        window.addEventListener(
          "error",
          function (e) {
            var text = "Boot error: " + (e.message || describe(e.error));
            record(text);
            show(text);
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var text = "Boot error (unhandled rejection): " + describe(e.reason);
          record(text);
          show(text);
        });
        try {
          var prev = window.localStorage.getItem(KEY);
          if (prev) show("Previous launch failed:\n" + prev);
        } catch (e) {}
        // Watchdog for the bundle-never-loaded case. 20 s, not 10 s: a
        // healthy first paint on a slow device can take ~10 s (measured
        // on the TV entry), and main-phone.tsx's own 15 s failsafe already
        // reports the bundle-loaded-but-empty case earlier.
        window.setTimeout(function () {
          var boot = document.getElementById("harbor-boot");
          if (!boot) return;
          var existing = document.getElementById("harbor-boot-error");
          if (existing && existing.textContent) return;
          var root = document.getElementById("root");
          if (root && root.childNodes.length > 0) return;
          var text =
            "Boot timed out after 20 seconds: the phone shell did not " +
            "render and no JavaScript error was captured. The bundle may " +
            "have stalled before first render. Tap Reload to try again.";
          record(text);
          show(text);
        }, 20000);
      })();
    </script>
    <script>
      // Phone safe-area variables (UI round, silent check 16). env() is the
      // only inset source visible to the page, but below Android WebView 140
      // it can report 0 for the status/gesture bars (it derives from the
      // display cutout, not the bars). Measure the resolved env() values
      // through a probe element and floor them: top >= 24px (status bar),
      // bottom >= 20px (gesture bar), so the tab bar and top chrome never
      // sit flush under the system bars even when env() under-reports.
      // Components read var(--harbor-safe-*, env(...)), so the web habitat
      // (which never loads this page) keeps plain env() behaviour.
      // tauri-plugin-safe-area-insets was NOT adopted here: it needs a new
      // Rust plugin registration + capability + JS dependency, a bigger
      // build risk than this page-level floor for a UI-only round. The
      // remaining limit is documented in stage2-progress.md: a WebView
      // that over-reports an inset only adds padding, it never hides chrome.
      (function () {
        var root = document.documentElement;
        function px(v) {
          var n = parseFloat(v);
          return isNaN(n) ? 0 : n;
        }
        function measure() {
          try {
            var probe = document.createElement("div");
            probe.style.cssText =
              "position:fixed;left:-9999px;top:0;width:0;height:0;visibility:hidden;" +
              "padding-top:env(safe-area-inset-top,0px);" +
              "padding-bottom:env(safe-area-inset-bottom,0px);" +
              "padding-left:env(safe-area-inset-left,0px);" +
              "padding-right:env(safe-area-inset-right,0px);";
            document.body.appendChild(probe);
            var cs = window.getComputedStyle(probe);
            root.style.setProperty("--harbor-safe-top", Math.max(px(cs.paddingTop), 24) + "px");
            root.style.setProperty(
              "--harbor-safe-bottom",
              Math.max(px(cs.paddingBottom), 20) + "px",
            );
            root.style.setProperty("--harbor-safe-left", cs.paddingLeft);
            root.style.setProperty("--harbor-safe-right", cs.paddingRight);
            document.body.removeChild(probe);
          } catch (e) {}
        }
        measure();
        var t;
        window.addEventListener("resize", function () {
          clearTimeout(t);
          t = window.setTimeout(measure, 150);
        });
      })();
    </script>
    <script type="module" src="/src/boot-artwork.ts"></script>
    <script type="module" src="/src/main-phone.tsx"></script>
  </body>
</html>
